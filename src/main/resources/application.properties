spring.application.name=springAI


spring.ai.openai.api-key = lm-studio
spring.ai.openai.base-url = http://127.0.0.1:1234/v1
spring.ai.openai.chat.options.model = phi-3-mini-4k-instruct
spring.ai.openai.chat.options.max-tokens=2048
spring.ai.openai.timeout=300s

spring.datasource.url=jdbc:postgresql://localhost:5433/vectordb
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.jpa.hibernate.ddl-auto=update


#spring.ai.chat.memory.repository.jdbc.initialize-schema=ALWAYS

spring.ai.vectorstore.pgvector.initialize-schema=true
spring.ai.vectorstore.pgvector.index-type=HNSW
spring.ai.vectorstore.pgvector.distance-type=COSINE_DISTANCE
spring.ai.vectorstore.pgvector.dimensions=768
spring.ai.vectorstore.pgvector.max-document-batch-size=10000